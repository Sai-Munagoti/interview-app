<!DOCTYPE html>
<html>
<head>
    <title>AJA Coding Tutor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #a5b4fc;
            --text: #2d3748;
            --text-light: #6b7280;
            --card-bg: #ffffff;
        }

        /* 🔥 NEW BACKGROUND GRADIENT – SKY + RED + BLACK */
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(130deg, #87CEFA, #ff4d4d, #000000);
            background-size: 300% 300%;
            animation: bgAnimation 12s ease infinite;
            margin: 0;
            padding: 0;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        @keyframes bgAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===================== FLOATING RAIN TEXT ===================== */

        .rain-text {
            position: fixed;
            top: -50px;
            font-size: 22px;
            color: #d2b48c; /* light brown */
            animation: fall 8s linear infinite;
            opacity: 0.8;
            pointer-events: none;
            font-weight: 700;
        }

        @keyframes fall {
            0% { transform: translateY(-50px); opacity: 1; }
            100% { transform: translateY(110vh); opacity: 0; }
        }

        /* Spawning Multiple falling labels */
        .rain-1 { left: 5%; animation-duration: 9s; }
        .rain-2 { left: 20%; animation-duration: 11s; }
        .rain-3 { left: 40%; animation-duration: 10s; }
        .rain-4 { left: 60%; animation-duration: 13s; }
        .rain-5 { left: 80%; animation-duration: 12s; }

        /* =================== EXISTING STYLES (UNTOUCHED) ===================== */

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            animation: fadeIn 0.8s ease-out;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            max-width: 800px;
        }

        .exam-badge {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            display: inline-block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 1rem;
            box-shadow: 0 4px 6px rgba(79, 70, 229, 0.15);
            animation: float 4s ease-in-out infinite;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            color: white;
            margin-bottom: 1rem;
        }

        .header p {
            color: #f1f1f1;
            font-size: 1.1rem;
        }

        .exam-features {
            display: flex;
            gap: 1rem;
            margin: 2rem 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .feature {
            background: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 0.95rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        form {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        label { color: black; font-weight: 700; }

        input, select {
            background: #f8fafc;
            border-radius: 10px;
        }

        .next-btn {
            margin-top: 1.5rem;
            padding: 1rem;
            background: linear-gradient(to right, var(--primary), var(--primary-dark));
            color: white;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .footer {
            margin-top: 4rem;
            text-align: center;
            color: white;
            font-size: 1rem;
        }
    </style>
</head>

<body>

    <!-- 🌧
