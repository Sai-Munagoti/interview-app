<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DevOps Interview Test - AJA Consulting</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #5C40FF;
      --secondary: #6B46C1;
      --light: #F9FAFB;
      --dark: #111827;
      --bg: linear-gradient(135deg, #E0F7FA 0%, #FFFFFF 100%);
      --card-bg: #FFFFFF;
      --shadow: 0 4px 20px rgba(0,0,0,0.05);
      --radius: 12px;
      --transition: all 0.3s ease;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--dark);
      position: relative;
      overflow-x: hidden;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
      position: absolute;
      top: 20px;
      width: 100%;
      z-index: 10;
    }

    .logo-text {
      font-size: 1.2rem;
      font-weight: 600;
      color: #6B46C1;
      margin: 0;
    }

    .badge {
      display: inline-block;
      background: var(--primary);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      margin-left: 10px;
      font-weight: 500;
    }

    .title {
      font-size: 2rem;
      color: var(--primary);
      font-weight: 700;
      margin: 1rem 0;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.05);
    }

    .form-card {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 400px;
      animation: fadeInUp 0.6s ease;
      transition: var(--transition);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: #333;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #D1D5DB;
      border-radius: 8px;
      font-size: 1rem;
      transition: var(--transition);
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(92, 64, 255, 0.2);
    }

    .btn-start {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-start:hover {
      background: var(--secondary);
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(92, 64, 255, 0.3);
    }

    footer {
      position: absolute;
      bottom: 10px;
      text-align: center;
      font-size: 0.8rem;
      color: #6B7280;
      width: 100%;
    }

    /* Optional: Dark mode */
    body.dark-mode {
      background: #111827;
      color: white;
    }

    body.dark-mode .form-card {
      background: #1F2937;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    body.dark-mode input, body.dark-mode select {
      background: #374151;
      border-color: #4B5563;
      color: white;
    }

    body.dark-mode .btn-start {
      background: #6B46C1;
    }

    body.dark-mode .btn-start:hover {
      background: #5C40FF;
    }

    .toggle-theme {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.9);
      border: 1px solid #ddd;
      padding: 8px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      z-index: 100;
    }

    body.dark-mode .toggle-theme {
      background: rgba(31,41,55,0.9);
      color: white;
    }
  </style>
</head>
<body>

  <div class="toggle-theme" onclick="toggleTheme()">☀️</div>

  <div class="header">
    <h1 class="logo-text">AJA Consulting Services LLP <span class="badge">AJA Coding Tutor</span></h1>
    <h2 class="title">DevOps Interview Test</h2>
  </div>

  <div class="form-card">
    <form id="examForm">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" required placeholder="Enter your full name" />
      </div>

      <div class="form-group">
        <label for="gender">Gender</label>
        <select id="gender" required>
          <option value="" disabled selected>Select Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="non-binary">Non-Binary</option>
          <option value="other">Other</option>
          <option value="prefer-not-to-say">Prefer not to say</option>
        </select>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="you@example.com" />
      </div>

      <button type="submit" class="btn-start">Start Exam</button>
    </form>
  </div>

  <footer>© 2025 AJA Consulting Services LLP | Privacy Policy</footer>

  <script>
    function toggleTheme() {
      const body = document.body;
      const toggle = document.querySelector('.toggle-theme');
      
      if (body.classList.contains('dark-mode')) {
        body.classList.remove('dark-mode');
        toggle.textContent = '☀️';
      } else {
        body.classList.add('dark-mode');
        toggle.textContent = '🌙';
      }
    }
  </script>

</body>
</html>
